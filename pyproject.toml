[project]
name = "memory-bench"
version = "0.1.0"
description = "Latency and power benchmarks for local AI long-term memory retrieval on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.2",
    "transformers>=4.40",
    "coremltools>=8.0",
    "usearch>=2.12",
    "rich>=13.0",
]

[project.scripts]
memory-bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
